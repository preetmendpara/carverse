<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <meta name="description" content="Manage brands, cars, media, 3D models, enquiries, AI chats and site settings.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('carverse-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
  <!-- The import graph is a waterfall otherwise: each module is
       only discovered once its importer has parsed. -->
  <link rel="modulepreload" href="../js/features/demo-admin.js">
  <link rel="modulepreload" href="../js/config/config.js">
  <link rel="modulepreload" href="../js/features/animate.js">
  <link rel="modulepreload" href="../js/features/motion.js">
  <link rel="modulepreload" href="../js/core/catalog.js">
  <link rel="modulepreload" href="../js/data/fallback-cars.js">
  <link rel="modulepreload" href="../js/data/car-photos.js">
  <link rel="modulepreload" href="../js/data/brand-logos.js">
  <link rel="modulepreload" href="../js/core/store.js">
  <link rel="modulepreload" href="../js/config/firebase.js">
  <link rel="modulepreload" href="../js/components/car-card.js">
  <link rel="modulepreload" href="../js/features/motion-fx.js">
  <link rel="modulepreload" href="../js/components/layout.js">
  <link rel="modulepreload" href="../js/config/auth.js">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="admin-brand-row">
        <div class="brand">Admin</div>
        <button class="theme-toggle" id="theme-toggle" type="button"
                aria-label="Switch between dark and light mode" title="Switch theme">
          <span class="icon-moon" aria-hidden="true">☾</span><span class="icon-sun" aria-hidden="true">☀</span>
        </button>
      </div>
      <nav class="admin-nav" id="admin-nav">
        <a href="#dashboard">Dashboard</a>
        <a href="#brands">Brands</a>
        <a href="#cars">Cars</a>
        <a href="#customers">Customers</a>
        <a href="#chats">AI Chats</a>
        <a href="#settings">Settings</a>
      </nav>
      <div class="admin-utils">
        <a href="../index.html">View website</a>
        <a href="#" id="logout">Logout</a>
      </div>
    </aside>
    <main class="admin-main" id="view">
      <p class="muted">Loading…</p>
    </main>
  </div>
  <div class="modal-back" id="modal-back"><div class="card card-pad modal" id="modal"></div></div>
  <script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
