<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <meta name="description" content="Manage brands, cars, media, 3D models, enquiries, AI chats and site settings.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('carverse-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="brand">Admin</div>
      <nav class="admin-nav" id="admin-nav">
        <a href="#dashboard">Dashboard</a>
        <a href="#brands">Brands</a>
        <a href="#cars">Cars</a>
        <a href="#customers">Customers</a>
        <a href="#chats">AI Chats</a>
        <a href="#settings">Settings</a>
        <a href="../index.html">View website</a>
        <a href="#" id="logout">Logout</a>
        <button class="theme-toggle" id="theme-toggle" type="button"
                aria-label="Switch between dark and light mode" title="Switch theme"
                style="margin-top:12px">
          <span class="icon-moon" aria-hidden="true">☾</span><span class="icon-sun" aria-hidden="true">☀</span>
        </button>
      </nav>
    </aside>
    <main class="admin-main" id="view">
      <p class="muted">Loading…</p>
    </main>
  </div>
  <div class="modal-back" id="modal-back"><div class="card card-pad modal" id="modal"></div></div>
  <script type="module" src="../js/pages/admin.js"></script>
</body>
</html>
