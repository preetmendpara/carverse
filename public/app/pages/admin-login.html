<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Sign In | %SITE%</title>
  <meta name="description" content="Secure sign-in for site administrators to manage brands, cars, media, enquiries and settings.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('carverse-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
  <!-- The import graph is a waterfall otherwise: each module is
       only discovered once its importer has parsed. -->
  <link rel="modulepreload" href="../js/config/config.js">
  <link rel="modulepreload" href="../js/core/store.js">
  <link rel="modulepreload" href="../js/config/firebase.js">
  <link rel="modulepreload" href="../js/config/auth.js">
  <link rel="modulepreload" href="../js/components/layout.js">
  <link rel="modulepreload" href="../js/features/motion-fx.js">
  <link rel="modulepreload" href="../js/features/motion.js">
  <link rel="modulepreload" href="../js/features/animate.js">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="site-header" class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html"><span>CarVerse</span></a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links"><span class="bars" aria-hidden="true"></span></button>
      <nav class="nav-links" id="nav-links"><a href="../index.html">Home</a><a href="../pages/cars.html">Cars</a><a href="../pages/brands.html">Brands</a><a href="../pages/compare.html">Compare</a><a href="../pages/wishlist.html">Wishlist</a><a href="../pages/contact.html">Contact</a></nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between dark and light mode" title="Switch theme"><span class="icon-moon" aria-hidden="true">☾</span><span class="icon-sun" aria-hidden="true">☀</span></button>
    </div>
  </header>
  <main class="section">
    <div class="container" style="max-width:420px">
      <h1 style="font-size:1.8rem">Admin login</h1>
      <p class="small">Only registered administrators can access the dashboard.</p>
      <form class="card card-pad" id="form">
        <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit">Sign in</button>
        <p class="small" id="status" style="margin-top:12px"></p>
      </form>
    </div>
  </main>
  <footer id="site-footer" class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div><div class="brand" style="margin-bottom:10px">CarVerse</div><p class="small">A minimal, data-driven car marketplace.</p></div>
        <div><h4>Explore</h4><a href="../index.html">Home</a><a href="../pages/cars.html">Cars</a><a href="../pages/brands.html">Brands</a><a href="../pages/compare.html">Compare</a><a href="../pages/wishlist.html">Wishlist</a><a href="../pages/contact.html">Contact</a></div>
        <div><h4>Contact</h4></div>
      </div>
      <div class="footer-bottom"><span>&copy; 2026 CarVerse. All rights reserved.</span></div>
    </div>
  </footer>
  <script type="module" src="../js/pages/admin-login.js"></script>
</body>
</html>
