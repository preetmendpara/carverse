<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us & Car Enquiries | %SITE%</title>
  <meta name="description" content="Send an enquiry about any car in our inventory — our team replies with pricing, finance and availability details.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('carverse-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
  <!-- The import graph is a waterfall otherwise: each module is
       only discovered once its importer has parsed. -->
  <link rel="modulepreload" href="js/features/chatbot.js">
  <link rel="modulepreload" href="js/components/layout.js">
  <link rel="modulepreload" href="js/features/motion-fx.js">
  <link rel="modulepreload" href="js/features/motion.js">
  <link rel="modulepreload" href="js/features/animate.js">
  <link rel="modulepreload" href="js/core/store.js">
  <link rel="modulepreload" href="js/config/config.js">
  <link rel="modulepreload" href="js/config/firebase.js">
  <link rel="modulepreload" href="js/core/catalog.js">
  <link rel="modulepreload" href="js/components/car-card.js">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="site-header" class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html"><span>CarVerse</span></a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links"><span class="bars" aria-hidden="true"></span></button>
      <nav class="nav-links" id="nav-links"><a href="../index.html">Home</a><a href="../pages/cars.html">Cars</a><a href="../pages/brands.html">Brands</a><a href="../pages/compare.html">Compare</a><a href="../pages/wishlist.html">Wishlist</a><a href="../pages/contact.html" class="active">Contact</a><a href="../pages/admin-login.html">Admin</a></nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between dark and light mode" title="Switch theme"><span class="icon-moon" aria-hidden="true">☾</span><span class="icon-sun" aria-hidden="true">☀</span></button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <div class="section-head" data-reveal><h1 style="font-size:2rem">Contact</h1></div>
      <div class="grid-2">
        <form class="card card-pad" id="form">
          <div class="field"><label for="name">Name</label><input id="name" required maxlength="100"></div>
          <div class="field"><label for="email">Email</label><input id="email" type="email" required maxlength="255"></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" required maxlength="20"></div>
          <div class="field"><label for="car">Selected car</label><select id="car"><option value="">General enquiry</option></select></div>
          <div class="field"><label for="message">Message</label><textarea id="message" required maxlength="1000"></textarea></div>
          <button class="btn btn-primary btn-block" type="submit" id="submit">Send enquiry</button>
          <p class="small" id="status" style="margin-top:12px"></p>
        </form>
        <div class="card card-pad" id="info"></div>
      </div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div><div class="brand" style="margin-bottom:10px">CarVerse</div><p class="small">A minimal, data-driven car marketplace.</p></div>
        <div><h4>Explore</h4><a href="../index.html">Home</a><a href="../pages/cars.html">Cars</a><a href="../pages/brands.html">Brands</a><a href="../pages/compare.html">Compare</a><a href="../pages/wishlist.html">Wishlist</a><a href="../pages/contact.html">Contact</a></div>
        <div><h4>Contact</h4></div>
      </div>
      <div class="footer-bottom"><span>&copy; 2026 CarVerse. All rights reserved.</span><span>GTU Minor Project</span></div>
    </div>
  </footer>
  <script type="module" src="../js/pages/contact.js"></script>
</body>
</html>
