# Root config for Cloudflare Workers deploy (`wrangler deploy`).
name = "carverse"
compatibility_date = "2026-01-01"
main = "server/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Admin media uploads. Create the bucket with:
#   npx wrangler r2 bucket create carverse-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "carverse-media"

[vars]
# Firebase web API key is public by design; it only identifies the project.
FIREBASE_API_KEY = "AIzaSyDtNQMbEr_sIVNWirivrl9klcb3vpIFzZU"
ADMIN_UIDS = "U95gwk62Ale4kPfCNSAlUQ7TQcq2"
# Enquiry mail (Brevo). The API key itself is a secret:
#   npx wrangler secret put BREVO_API_KEY
# Brevo verifies one sender address by email, so no DNS records are needed.
MAIL_FROM = "CarVerse <sales@carverse.de5.net>"
SALES_EMAIL = "priieeet@gmail.com"
